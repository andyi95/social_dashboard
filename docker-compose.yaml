version: '3.4'

services:
  backend:
    image: registry.andyi95.com/social-dashboard/backend:v0.1
    build: backend
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    env_file:
      - .env

  worker:
    image: registry.andyi95.com/social-dashboard/backend:v0.1
    build: backend
    command: python services/worker.py && python services/word_parser.py
    env_file:
      - .env
